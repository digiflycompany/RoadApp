name: roadapp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.4+4

environment:
  sdk: '>=3.2.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  flutter_screenutil: ^5.9.0
  eva_icons_flutter: ^4.0.0
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.0.8
  # introduction_screen: ^3.1.12
  animated_splash_screen: ^1.3.0
  fl_chart: ^0.64.0
  flutter_slidable: ^3.0.0
  # smooth_page_indicator: ^1.1.0
  # carousel_slider: ^4.2.1
  internet_connection_checker: ^1.0.0+1
  build_runner: ^2.4.9
  dio: ^5.7.0
  retrofit: ^4.4.1
  retrofit_generator: ^9.1.9
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  firebase_messaging: ^14.7.2
  #  flutter_local_notifications: ^16.1.0
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter
  awesome_dialog: ^3.1.0
  fluttertoast: ^8.2.8
  table_calendar: ^3.0.9
  pinput: ^2.2.8
  pretty_dio_logger: ^1.4.0
  hive: ^2.2.3
  get_it: ^7.7.0
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  logger: ^2.4.0
  device_preview: ^1.1.0
  intl:
  gap: ^3.0.1
  image_picker: ^1.0.7
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  #emoji_picker_flutter: ^1.5.2
  lottie: ^3.1.3
  hive_flutter: ^1.1.0
  pdf:
  excel:
  path_provider: ^2.0.14
#  share: ^2.0.4
  url_launcher:
  share_plus: ^7.0.2
  page_transition: ^2.2.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^2.0.0


flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/road_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/road_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lang/ar.json
    - assets/lang/en.json
    - assets/animations/

  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/font/NotoKufiArabic-Regular.ttf
          style: italic
    - family: 'cairo'
      fonts:
        - asset: assets/font/cairo/Cairo-Bold.ttf
        - asset: assets/font/cairo/Cairo-Regular.ttf